<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐍 贪吃蛇</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
            padding: 10px 10px 14px;
            margin: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { font-size: 22px; margin: 2px 0 6px; }
        .score { font-size: 17px; margin: 0 0 8px; color: #888; }
        .score b { color: #4ecca3; font-size: 24px; }
        .score i { font-style: normal; color: #f0c040; font-weight: bold; font-size: 20px; }

        .speedbar { display: flex; gap: 6px; justify-content: center; margin: 0 0 6px; }
        .spd {
            font-family: inherit;
            font-size: 12px;
            padding: 5px 10px;
            color: #888;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            cursor: pointer;
            touch-action: none;
        }
        .spd.on { color: #1a1a2e; background: #4ecca3; border-color: #4ecca3; font-weight: bold; }

        .rule { font-size: 12px; color: #7a7a8c; margin: 0 0 8px; min-height: 16px; }

        canvas {
            width: min(400px, 82vw);
            height: auto;
            background: #16213e;
            border: 3px solid #0f3460;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(78, 204, 163, 0.15);
            touch-action: none;
        }
        .dpad {
            display: grid;
            grid-template-areas:
                ".    up    ."
                "left .     right"
                ".    down  .";
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 46px);
            gap: 7px;
            justify-content: center;
            margin: 12px auto 0;
        }
        .pad-btn {
            font-size: 20px;
            color: #4ecca3;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            cursor: pointer;
            touch-action: none;
            transition: background 0.08s;
        }
        .pad-btn:active { background: #0f3460; transform: scale(0.94); }
        .pad-up    { grid-area: up; }
        .pad-left  { grid-area: left; }
        .pad-right { grid-area: right; }
        .pad-down  { grid-area: down; }

        .tip { color: #666; font-size: 12px; margin-top: 12px; }
        .desktop-only { display: inline; }
        @media (hover: none) { .desktop-only { display: none; } }
    </style>
</head>
<body>

    <h1>🐍 贪吃蛇</h1>

    <p class="score">
        得分 <b id="score">0</b>
        &nbsp;·&nbsp;
        最高 <i id="best">0</i>
    </p>

    <div class="speedbar">
        <button class="spd" data-level="easy">🟢 简单</button>
        <button class="spd" data-level="normal">🟡 中等</button>
        <button class="spd" data-level="hard">🔴 困难</button>
    </div>

    <p class="rule" id="rule"></p>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="dpad">
        <button class="pad-btn pad-up"    data-x="0"  data-y="-1">▲</button>
        <button class="pad-btn pad-left"  data-x="-1" data-y="0">◀</button>
        <button class="pad-btn pad-right" data-x="1"  data-y="0">▶</button>
        <button class="pad-btn pad-down"  data-x="0"  data-y="1">▼</button>
    </div>

    <p class="tip">v0.17 — 三档开局速度一样，每吃 3 个食物加快一点</p>


    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const ruleEl = document.getElementById("rule");

        const CELL = 20;
        const GRID = canvas.width / CELL;

        // ---------- 速度设置（三档完全一样）----------
        const START_DELAY = 300;        // 开局：每 300 毫秒走一步
        const MIN_DELAY = 90;           // 最快：90 毫秒一步（很刺激）
        const SPEED_UP_EVERY = 3;       // 每吃 3 个食物，加速一次
        const SPEED_UP_STEP = 12;       // 每次加快 12 毫秒

        // ---------- 三档难度：区别只在"规则"，不在速度 ----------
        const LEVELS = {
            easy:   { name: "简单", rule: "🟢 简单：可以穿墙，撞到自己才会结束" },
            normal: { name: "中等", rule: "🟡 中等：撞墙或撞自己都会结束" },
            hard:   { name: "困难", rule: "🔴 困难：有障碍物，撞到就结束" },
        };

        // 读取上次选的难度（旧版本的值不认识就用"中等"）
        let level = localStorage.getItem("snakeLevel") || "normal";
        if (!LEVELS[level]) level = "normal";

        let snake, food, dir, score, gameOver, delay, walls, foodsEaten;

        // ---------- 排行榜：每个难度各存一份 ----------
        // 数据结构：{ easy: [...], normal: [...], hard: [...] }
        let allScores = JSON.parse(localStorage.getItem("snakeScoresV2") || "null");

        if (!allScores) {
            // 第一次用新版：把旧数据（一个数组）搬到"中等"难度下
            const oldScores = JSON.parse(localStorage.getItem("snakeScores") || "[]");
            allScores = { easy: [], normal: oldScores, hard: [] };
        }

        // 保险：三个键都必须存在
        if (!allScores.easy)   allScores.easy = [];
        if (!allScores.normal) allScores.normal = [];
        if (!allScores.hard)   allScores.hard = [];

        let best = 0;

        function currentScores() {
            return allScores[level] || [];
        }

        function refreshBest() {
            const list = currentScores();
            best = (list.length > 0) ? list[0] : 0;
            bestEl.textContent = best;
        }


        // ---------- 音效 ----------
        let audioCtx = null;

        function beep(freq, duration) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.001, audioCtx.currentTime + duration / 1000
            );

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }


        // ---------- 记成绩 ----------
        function saveScore(value) {
            const list = currentScores();

            list.push(value);
            list.sort(function (a, b) { return b - a; });
            allScores[level] = list.slice(0, 5);

            localStorage.setItem("snakeScoresV2", JSON.stringify(allScores));
            refreshBest();
        }


        // ---------- 生成障碍物（只有困难模式有）----------
        function buildWalls() {
            if (level !== "hard") {
                walls = [];
                return;
            }

            // 四个角落里各一条横杠
            walls = [
                { x: 4,  y: 4 },  { x: 5,  y: 4 },  { x: 6,  y: 4 },
                { x: 13, y: 4 },  { x: 14, y: 4 },  { x: 15, y: 4 },
                { x: 4,  y: 15 }, { x: 5,  y: 15 }, { x: 6,  y: 15 },
                { x: 13, y: 15 }, { x: 14, y: 15 }, { x: 15, y: 15 },
            ];
        }


        // ---------- 开始新一局 ----------
        function reset() {
            snake = [
                { x: 10, y: 10 },
                { x: 9,  y: 10 },
                { x: 8,  y: 10 },
            ];
            dir = { x: 1, y: 0 };
            score = 0;
            foodsEaten = 0;
            gameOver = false;
            delay = START_DELAY;            // 三档开局速度一样
            scoreEl.textContent = score;
            buildWalls();
            randomFood();
            draw();
        }


        // ---------- 切换难度 ----------
        function markLevelButtons() {
            document.querySelectorAll(".spd").forEach(function (btn) {
                if (btn.dataset.level === level) btn.classList.add("on");
                else btn.classList.remove("on");
            });
            ruleEl.textContent = LEVELS[level].rule;
        }

        function setLevel(name) {
            level = name;
            localStorage.setItem("snakeLevel", name);
            markLevelButtons();
            refreshBest();
            reset();
        }

        document.querySelectorAll(".spd").forEach(function (btn) {
            btn.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                setLevel(btn.dataset.level);
            });
        });


        function setDir(nx, ny) {
            if (gameOver) return;
            if (nx !== 0 && dir.x === -nx) return;
            if (ny !== 0 && dir.y === -ny) return;
            dir = { x: nx, y: ny };
        }


        function drawCell(x, y, color, radius) {
            if (radius === undefined) radius = 6;
            const px = x * CELL + 1;
            const py = y * CELL + 1;
            const size = CELL - 2;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(px, py, size, size, radius);
            ctx.fill();
        }


        function drawDot(cx, cy, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        }


        // ---------- 随机放食物（不能放在蛇身或障碍物上）----------
        function randomFood() {
            let p, blocked;

            do {
                blocked = false;
                p = {
                    x: Math.floor(Math.random() * GRID),
                    y: Math.floor(Math.random() * GRID),
                };

                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === p.x && snake[i].y === p.y) blocked = true;
                }
                for (let i = 0; i < walls.length; i++) {
                    if (walls[i].x === p.x && walls[i].y === p.y) blocked = true;
                }
            } while (blocked);

            food = p;
        }


        function draw() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 障碍物
            for (let i = 0; i < walls.length; i++) {
                drawCell(walls[i].x, walls[i].y, "#2a3f5f", 4);
            }

            // 食物：发光
            ctx.shadowColor = "#e94560";
            ctx.shadowBlur = 18;
            drawCell(food.x, food.y, "#e94560", 10);
            ctx.shadowBlur = 0;

            // 蛇身
            for (let i = 0; i < snake.length; i++) {
                const t = i / snake.length;
                const lightness = 55 - t * 25;
                drawCell(snake[i].x, snake[i].y, `hsl(160, 60%, ${lightness}%)`, 6);
            }

            // 蛇眼睛
            const head = snake[0];
            const cx = head.x * CELL + CELL / 2;
            const cy = head.y * CELL + CELL / 2;
            const ox = dir.x * 3, oy = dir.y * 3;
            const px = -dir.y * 4, py = dir.x * 4;
            drawDot(cx + ox + px, cy + oy + py, 2.5, "#0f3460");
            drawDot(cx + ox - px, cy + oy - py, 2.5, "#0f3460");

            // 结束遮罩
            if (gameOver) {
                const W = canvas.width;
                const H = canvas.height;

                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = "center";

                ctx.fillStyle = "#e94560";
                ctx.font = "bold 34px sans-serif";
                ctx.fillText("游戏结束", W / 2, 62);

                ctx.fillStyle = "#eee";
                ctx.font = "20px sans-serif";
                ctx.fillText("本次得分：" + score, W / 2, 102);

                if (score >= best && score > 0) {
                    ctx.fillStyle = "#f0c040";
                    ctx.font = "bold 17px sans-serif";
                    ctx.fillText("🏆 新纪录！", W / 2, 130);
                }

                const list = currentScores();

                ctx.fillStyle = "#4ecca3";
                ctx.font = "bold 20px sans-serif";
                ctx.fillText("🏆 " + LEVELS[level].name + "难度 · 排行榜", W / 2, 172);

                if (list.length === 0) {
                    ctx.fillStyle = "#666";
                    ctx.font = "16px sans-serif";
                    ctx.fillText("还没有记录", W / 2, 210);
                }

                for (let i = 0; i < list.length; i++) {
                    const y = 204 + i * 27;
                    ctx.fillStyle = (i < 3) ? "#f0c040" : "#888";
                    ctx.font = (i < 3) ? "bold 19px sans-serif" : "17px sans-serif";
                    const medal = (i === 0) ? "🥇" : (i === 1) ? "🥈" : (i === 2) ? "🥉" : (i + 1) + ".";
                    ctx.fillText(medal + "  " + list[i] + " 分", W / 2, y);
                }

                ctx.fillStyle = "#666";
                ctx.font = "14px sans-serif";
                ctx.fillText("按空格或点画面重新开始", W / 2, H - 22);
            }
        }


        // ---------- 检查某个位置是不是障碍物 ----------
        function isWall(x, y) {
            for (let i = 0; i < walls.length; i++) {
                if (walls[i].x === x && walls[i].y === y) return true;
            }
            return false;
        }


        function move() {
            if (gameOver) return;

            const head = snake[0];
            const newHead = { x: head.x + dir.x, y: head.y + dir.y };

            // ---------- 撞墙 ----------
            const outOfBounds =
                newHead.x < 0 || newHead.x >= GRID ||
                newHead.y < 0 || newHead.y >= GRID;

            if (outOfBounds) {
                if (level === "easy") {
                    // 简单模式：从对面穿出来
                    if (newHead.x < 0) newHead.x = GRID - 1;
                    if (newHead.x >= GRID) newHead.x = 0;
                    if (newHead.y < 0) newHead.y = GRID - 1;
                    if (newHead.y >= GRID) newHead.y = 0;
                } else {
                    die();
                    return;
                }
            }

            // ---------- 撞障碍物 ----------
            if (isWall(newHead.x, newHead.y)) {
                die();
                return;
            }

            // ---------- 撞自己 ----------
            for (let i = 0; i < snake.length - 1; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    die();
                    return;
                }
            }

            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                score = score + 1;
                scoreEl.textContent = score;
                beep(880, 90);

                foodsEaten = foodsEaten + 1;

                // 每吃 SPEED_UP_EVERY 个，就加快一点（但不会快过 MIN_DELAY）
                if (foodsEaten % SPEED_UP_EVERY === 0) {
                    delay = Math.max(MIN_DELAY, delay - SPEED_UP_STEP);
                }

                randomFood();
            } else {
                snake.pop();
            }
        }


        function die() {
            gameOver = true;
            beep(150, 400);
            saveScore(score);
            draw();
        }


        // ---------- 键盘 ----------
        document.addEventListener("keydown", function (event) {
            const key = event.key;
            if (key.startsWith("Arrow") || key === " ") event.preventDefault();

            if (key === " ") {
                if (gameOver) reset();
                return;
            }

            if (key === "ArrowUp")    setDir(0, -1);
            if (key === "ArrowDown")  setDir(0, 1);
            if (key === "ArrowLeft")  setDir(-1, 0);
            if (key === "ArrowRight") setDir(1, 0);
        });


        // ---------- 屏幕按钮 ----------
        document.querySelectorAll(".pad-btn").forEach(function (btn) {
            btn.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                setDir(Number(btn.dataset.x), Number(btn.dataset.y));
            });
        });

        canvas.addEventListener("pointerdown", function () {
            if (gameOver) reset();
        });


        // ---------- 滑动手势 ----------
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", function (event) {
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener("touchend", function (event) {
            const dx = event.changedTouches[0].clientX - touchStartX;
            const dy = event.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) setDir(1, 0);
                else        setDir(-1, 0);
            } else {
                if (dy > 0) setDir(0, 1);
                else        setDir(0, -1);
            }
        }, { passive: true });


        // ---------- 游戏循环 ----------
        function tick() {
            move();
            draw();
            setTimeout(tick, delay);
        }

        markLevelButtons();
        refreshBest();
        reset();
        tick();
    </script>

</body>
</html>
