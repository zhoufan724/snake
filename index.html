<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐍 贪吃蛇</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
            padding: 10px 10px 14px;
            margin: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { font-size: 22px; margin: 2px 0 6px; }
        .score {
            font-size: 17px;
            margin: 0 0 8px;
            color: #888;
        }
        .score b { color: #4ecca3; font-size: 24px; }
        .score i {
            font-style: normal;
            color: #f0c040;
            font-weight: bold;
            font-size: 20px;
        }
        canvas {
            width: min(400px, 82vw);
            height: auto;
            background: #16213e;
            border: 3px solid #0f3460;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(78, 204, 163, 0.15);
            touch-action: none;
        }
        .speedbar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 0 0 10px;
        }
        .spd {
            font-family: inherit;
            font-size: 14px;
            padding: 5px 14px;
            color: #888;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            cursor: pointer;
            touch-action: none;
        }
        .spd.on {
            color: #1a1a2e;
            background: #4ecca3;
            border-color: #4ecca3;
            font-weight: bold;
        }

        .dpad {
            display: grid;
            grid-template-areas:
                ".    up    ."
                "left .     right"
                ".    down  .";
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 46px);
            gap: 7px;
            justify-content: center;
            margin: 12px auto 0;
        }
        .pad-btn {
            font-size: 22px;
            color: #4ecca3;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            cursor: pointer;
            touch-action: none;
            transition: background 0.08s;
        }
        .pad-btn:active { background: #0f3460; transform: scale(0.94); }
        .pad-up    { grid-area: up; }
        .pad-left  { grid-area: left; }
        .pad-right { grid-area: right; }
        .pad-down  { grid-area: down; }
        .tip { color: #666; font-size: 12px; margin-top: 12px; }
        .desktop-only { display: inline; }
        @media (hover: none) { .desktop-only { display: none; } }
    </style>
</head>
<body>

    <h1>🐍 贪吃蛇</h1>

    <p class="score">
        得分 <b id="score">0</b>
        &nbsp;·&nbsp;
        最高 <i id="best">0</i>
    </p>

    <div class="speedbar">
        <button class="spd" data-delay="400">🐢 慢</button>
        <button class="spd" data-delay="250">🐇 中</button>
        <button class="spd" data-delay="150">⚡ 快</button>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="dpad">
        <button class="pad-btn pad-up"    data-x="0"  data-y="-1">▲</button>
        <button class="pad-btn pad-left"  data-x="-1" data-y="0">◀</button>
        <button class="pad-btn pad-right" data-x="1"  data-y="0">▶</button>
        <button class="pad-btn pad-down"  data-x="0"  data-y="1">▼</button>
    </div>

    <p class="tip">v0.12 — 手机上可直接在画面里滑动手指控制</p>


    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");

        const CELL = 20;
        const GRID = canvas.width / CELL;

        let snake, food, dir, score, gameOver, delay;

        // 基础速度（毫秒），越小越快。存在浏览器里，下次打开还记得
        let baseDelay = Number(localStorage.getItem("snakeDelay") || 250);

        // ---------- 排行榜（存在浏览器里，最多留 5 条）----------
        // localStorage 只能存"字符串"，所以用 JSON 转换
        let scores = JSON.parse(localStorage.getItem("snakeScores") || "[]");

        // 数组是降序排的，第一个就是最高分
        let best = 0;
        if (scores.length > 0) best = scores[0];
        bestEl.textContent = best;


        // ---------- 把一个新成绩记进排行榜 ----------
        function saveScore(value) {
            scores.push(value);

            // 从大到小排
            scores.sort(function (a, b) {
                return b - a;
            });

            scores = scores.slice(0, 5);        // 只留前 5

            localStorage.setItem("snakeScores", JSON.stringify(scores));

            best = scores[0];
            bestEl.textContent = best;
        }


        // ---------- 🔊 音效（用代码合成，不用下载音频文件）----------
        let audioCtx = null;

        function beep(freq, duration) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.frequency.value = freq;

            // 音量从 0.1 慢慢降到接近 0（避免"咔"的杂音）
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.001, audioCtx.currentTime + duration / 1000
            );

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }


        // ---------- 开始新一局 ----------
        function reset() {
            snake = [
                { x: 10, y: 10 },
                { x: 9,  y: 10 },
                { x: 8,  y: 10 },
            ];
            dir = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            delay = baseDelay;              // 恢复玩家选的速度
            scoreEl.textContent = score;
            randomFood();
            draw();
        }


        function setDir(nx, ny) {
            if (gameOver) return;
            if (nx !== 0 && dir.x === -nx) return;
            if (ny !== 0 && dir.y === -ny) return;
            dir = { x: nx, y: ny };
        }


        function drawCell(x, y, color, radius) {
            if (radius === undefined) radius = 6;
            const px = x * CELL + 1;
            const py = y * CELL + 1;
            const size = CELL - 2;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(px, py, size, size, radius);
            ctx.fill();
        }


        function drawDot(cx, cy, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        }


        function randomFood() {
            let p, onSnake;

            do {
                onSnake = false;
                p = {
                    x: Math.floor(Math.random() * GRID),
                    y: Math.floor(Math.random() * GRID),
                };
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === p.x && snake[i].y === p.y) onSnake = true;
                }
            } while (onSnake);

            food = p;
        }


        function draw() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 食物：发光
            ctx.shadowColor = "#e94560";
            ctx.shadowBlur = 18;
            drawCell(food.x, food.y, "#e94560", 10);
            ctx.shadowBlur = 0;

            // 蛇身
            for (let i = 0; i < snake.length; i++) {
                const t = i / snake.length;
                const lightness = 55 - t * 25;
                drawCell(snake[i].x, snake[i].y, `hsl(160, 60%, ${lightness}%)`, 6);
            }

            // 蛇眼睛
            const head = snake[0];
            const cx = head.x * CELL + CELL / 2;
            const cy = head.y * CELL + CELL / 2;
            const ox = dir.x * 3, oy = dir.y * 3;
            const px = -dir.y * 4, py = dir.x * 4;
            drawDot(cx + ox + px, cy + oy + py, 2.5, "#0f3460");
            drawDot(cx + ox - px, cy + oy - py, 2.5, "#0f3460");

            // 结束遮罩
            if (gameOver) {
                const W = canvas.width;
                const H = canvas.height;

                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = "center";

                // 标题
                ctx.fillStyle = "#e94560";
                ctx.font = "bold 34px sans-serif";
                ctx.fillText("游戏结束", W / 2, 62);

                // 本次得分
                ctx.fillStyle = "#eee";
                ctx.font = "20px sans-serif";
                ctx.fillText("本次得分：" + score, W / 2, 102);

                if (score >= best && score > 0) {
                    ctx.fillStyle = "#f0c040";
                    ctx.font = "bold 17px sans-serif";
                    ctx.fillText("🏆 新纪录！", W / 2, 130);
                }

                // 排行榜
                ctx.fillStyle = "#4ecca3";
                ctx.font = "bold 20px sans-serif";
                ctx.fillText("🏆 排行榜", W / 2, 176);

                for (let i = 0; i < scores.length; i++) {
                    const y = 208 + i * 27;

                    // 前三名用金色，其他用灰色
                    ctx.fillStyle = (i < 3) ? "#f0c040" : "#888";
                    ctx.font = (i < 3) ? "bold 19px sans-serif" : "17px sans-serif";

                    const medal = (i === 0) ? "🥇" : (i === 1) ? "🥈" : (i === 2) ? "🥉" : (i + 1) + ".";
                    ctx.fillText(medal + "  " + scores[i] + " 分", W / 2, y);
                }

                // 底部提示
                ctx.fillStyle = "#666";
                ctx.font = "14px sans-serif";
                ctx.fillText("按空格或点画面重新开始", W / 2, H - 22);
            }
        }


        function move() {
            if (gameOver) return;

            const head = snake[0];
            const newHead = { x: head.x + dir.x, y: head.y + dir.y };

            // 撞墙
            if (newHead.x < 0 || newHead.x >= GRID ||
                newHead.y < 0 || newHead.y >= GRID) {
                die();
                return;
            }

            // 撞自己
            for (let i = 0; i < snake.length - 1; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    die();
                    return;
                }
            }

            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                // 吃到了！
                score = score + 1;
                scoreEl.textContent = score;
                beep(880, 90);                          // 🔊 "叮"

                // 每吃 5 个，稍微加速一点
                // 最快不超过基础速度的 55%（不会快到失控）
                if (score % 5 === 0) {
                    delay = Math.max(Math.round(baseDelay * 0.55), delay - 8);
                }

                randomFood();
            } else {
                snake.pop();
            }
        }


        // ---------- 死亡处理 ----------
        function die() {
            gameOver = true;

            beep(150, 400);                                 // 🔊 低沉的"咚"

            saveScore(score);       // 记进排行榜

            draw();
        }


        // ---------- 键盘 ----------
        document.addEventListener("keydown", function (event) {
            const key = event.key;
            if (key.startsWith("Arrow") || key === " ") event.preventDefault();

            if (key === " ") {
                if (gameOver) reset();
                return;
            }

            if (key === "ArrowUp")    setDir(0, -1);
            if (key === "ArrowDown")  setDir(0, 1);
            if (key === "ArrowLeft")  setDir(-1, 0);
            if (key === "ArrowRight") setDir(1, 0);
        });


        // ---------- 速度选择 ----------
        function markSpeedButtons() {
            document.querySelectorAll(".spd").forEach(function (btn) {
                if (Number(btn.dataset.delay) === baseDelay) {
                    btn.classList.add("on");
                } else {
                    btn.classList.remove("on");
                }
            });
        }

        function setSpeed(value) {
            baseDelay = value;
            localStorage.setItem("snakeDelay", value);
            markSpeedButtons();
            reset();
        }

        document.querySelectorAll(".spd").forEach(function (btn) {
            btn.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                setSpeed(Number(btn.dataset.delay));
            });
        });


        // ---------- 屏幕按钮 ----------
        document.querySelectorAll(".pad-btn").forEach(function (btn) {
            btn.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                setDir(Number(btn.dataset.x), Number(btn.dataset.y));
            });
        });

        canvas.addEventListener("pointerdown", function () {
            if (gameOver) reset();
        });


        // ---------- 👆 滑动手势（手机上最顺手）----------
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", function (event) {
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener("touchend", function (event) {
            const dx = event.changedTouches[0].clientX - touchStartX;
            const dy = event.changedTouches[0].clientY - touchStartY;

            // 动得太少，不算滑动（可能是想"点一下"）
            if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;

            // 比较横竖哪个动得多，决定是左右还是上下
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) setDir(1, 0);      // 往右滑
                else        setDir(-1, 0);     // 往左滑
            } else {
                if (dy > 0) setDir(0, 1);      // 往下滑
                else        setDir(0, -1);     // 往上滑
            }
        }, { passive: true });


        // ---------- 游戏循环：用 setTimeout 才能随时改速度 ----------
        function tick() {
            move();
            draw();
            setTimeout(tick, delay);        // 用"当前"的 delay 排下一次
        }

        markSpeedButtons();
        reset();
        tick();
    </script>

</body>
</html>
