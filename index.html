<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇</title>
    <style>
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
            padding: 30px 20px;
            margin: 0;
        }
        h1 { font-size: 32px; margin: 10px 0 20px; }
        canvas {
            background: #16213e;
            border: 3px solid #0f3460;
            border-radius: 10px;
        }
        .tip {
            color: #888;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <h1>🐍 贪吃蛇</h1>

    <canvas id="game" width="400" height="400"></canvas>

    <p class="tip">v0.2 — 蛇会动了（暂时会穿墙）</p>


    <script>
        // ---------- 拿到画布和画笔 ----------
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // ---------- 基础设置 ----------
        const CELL = 20;                       // 每个格子 20 像素
        const GRID = canvas.width / CELL;      // 一共 20 格
        const SPEED = 200;                     // 多少毫秒走一步（越小越快）

        // ---------- 蛇 ----------
        let snake = [
            { x: 10, y: 10 },      // 头
            { x: 9,  y: 10 },      // 身体
            { x: 8,  y: 10 },      // 尾巴
        ];

        // ---------- 食物 ----------
        let food = { x: 15, y: 10 };


        // ---------- 画一个方块 ----------
        function drawCell(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        }


        // ---------- 画整个画面 ----------
        function draw() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawCell(food.x, food.y, "#e94560");

            for (let i = 0; i < snake.length; i++) {
                const color = (i === 0) ? "#4ecca3" : "#2e8b72";
                drawCell(snake[i].x, snake[i].y, color);
            }
        }


        // ---------- 走一步：加头、去尾 ----------
        function move() {
            const head = snake[0];

            // 1. 算出新头的位置（往右一格）
            const newHead = { x: head.x + 1, y: head.y };

            // 2. 暂时让它穿墙（正式版会改成撞墙就死）
            if (newHead.x >= GRID) newHead.x = 0;

            // 3. 头加一格
            snake.unshift(newHead);

            // 4. 尾巴去一格
            snake.pop();
        }


        // ---------- 定时器：每 SPEED 毫秒执行一次 ----------
        setInterval(function () {
            move();
            draw();
        }, SPEED);


        // ---------- 先画一次，避免开头一闪 ----------
        draw();
    </script>

</body>
</html>
