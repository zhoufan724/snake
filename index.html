<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐍 贪吃蛇</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background: #0d0818;
            color: #eee;
            text-align: center;
            padding: 10px 10px 14px;
            margin: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { font-size: 22px; margin: 2px 0 6px; }
        .score { font-size: 17px; margin: 0 0 8px; color: #888; }
        .score b { color: #c9a6ff; font-size: 24px; }
        .score i { font-style: normal; color: #f0c040; font-weight: bold; font-size: 20px; }

        .speedbar { display: flex; gap: 6px; justify-content: center; margin: 0 0 6px; }
        .spd {
            font-family: inherit;
            font-size: 12px;
            padding: 5px 10px;
            color: #888;
            background: #1c1435;
            border: 2px solid #3a2b5e;
            border-radius: 20px;
            cursor: pointer;
            touch-action: none;
        }
        .spd.on { color: #1a1030; background: #b18cff; border-color: #b18cff; font-weight: bold; }

        .rule { font-size: 12px; color: #8f83ad; margin: 0 0 8px; min-height: 16px; }

        canvas {
            width: min(400px, 82vw);
            height: auto;
            background: #170f2c;
            border: 3px solid #3a2b5e;
            border-radius: 14px;
            box-shadow:
                0 0 42px rgba(160, 130, 255, 0.26),
                inset 0 0 55px rgba(0, 0, 0, 0.55);
            touch-action: none;
        }
        .dpad {
            display: grid;
            grid-template-areas:
                ".    up    ."
                "left .     right"
                ".    down  .";
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 46px);
            gap: 7px;
            justify-content: center;
            margin: 12px auto 0;
        }
        .pad-btn {
            font-size: 20px;
            color: #c9a6ff;
            background: #1c1435;
            border: 2px solid #3a2b5e;
            border-radius: 12px;
            cursor: pointer;
            touch-action: none;
            transition: background 0.08s;
        }
        .pad-btn:active { background: #3a2b5e; transform: scale(0.94); }
        .pad-up    { grid-area: up; }
        .pad-left  { grid-area: left; }
        .pad-right { grid-area: right; }
        .pad-down  { grid-area: down; }

        .tip { color: #6b6280; font-size: 12px; margin-top: 12px; }
        .desktop-only { display: inline; }
        @media (hover: none) { .desktop-only { display: none; } }
    </style>
</head>
<body>

    <h1>🐍 贪吃蛇</h1>

    <p class="score">
        得分 <b id="score">0</b>
        &nbsp;·&nbsp;
        最高 <i id="best">0</i>
    </p>

    <div class="speedbar">
        <button class="spd" data-level="easy">🟢 简单</button>
        <button class="spd" data-level="normal">🟡 中等</button>
        <button class="spd" data-level="hard">🔴 困难</button>
    </div>

    <p class="rule" id="rule"></p>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="dpad">
        <button class="pad-btn pad-up"    data-x="0"  data-y="-1">▲</button>
        <button class="pad-btn pad-left"  data-x="-1" data-y="0">◀</button>
        <button class="pad-btn pad-right" data-x="1"  data-y="0">▶</button>
        <button class="pad-btn pad-down"  data-x="0"  data-y="1">▼</button>
    </div>

    <p class="tip">v0.25 — 薄荷萌蛇 三档开局速度一样，每吃 3 个食物加快一点</p>


    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const ruleEl = document.getElementById("rule");

        const CELL = 20;
        const GRID = canvas.width / CELL;

        // ---------- 背景：银河主题（只画一次，之后每帧直接贴上去）----------
        const bgCanvas = document.createElement("canvas");
        bgCanvas.width = canvas.width;
        bgCanvas.height = canvas.height;

        (function buildBackground() {
            const bg = bgCanvas.getContext("2d");
            const W = bgCanvas.width;
            const H = bgCanvas.height;

            function rnd(a, b) { return a + Math.random() * (b - a); }

            // ① 径向渐变底（中心亮、四周暗）
            const grad = bg.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, W * 0.8);
            grad.addColorStop(0,    "#241a3d");
            grad.addColorStop(0.62, "#170f2c");
            grad.addColorStop(1,    "#0a0616");
            bg.fillStyle = grad;
            bg.fillRect(0, 0, W, H);

            // ② 星点
            for (let i = 0; i < 150; i++) {
                const x = rnd(0, W), y = rnd(0, H);
                const r = rnd(0.3, 1.4);
                bg.fillStyle = `rgba(255, 255, 255, ${rnd(0.2, 0.9)})`;
                bg.beginPath();
                bg.arc(x, y, r, 0, Math.PI * 2);
                bg.fill();
            }

            // ③ 几颗四角闪光
            for (let i = 0; i < 4; i++) {
                const x = rnd(30, W - 30), y = rnd(30, H - 30), r = rnd(5, 9);
                bg.fillStyle = `rgba(220, 210, 255, ${rnd(0.4, 0.75)})`;
                bg.beginPath();
                bg.moveTo(x, y - r);
                bg.lineTo(x + r * 0.22, y - r * 0.22);
                bg.lineTo(x + r, y);
                bg.lineTo(x + r * 0.22, y + r * 0.22);
                bg.lineTo(x, y + r);
                bg.lineTo(x - r * 0.22, y + r * 0.22);
                bg.lineTo(x - r, y);
                bg.lineTo(x - r * 0.22, y - r * 0.22);
                bg.closePath();
                bg.fill();
            }

            // ④ 很淡的网格（+0.5 让 1 像素的线更清晰）
            bg.strokeStyle = "rgba(190, 170, 255, 0.045)";
            bg.lineWidth = 1;
            for (let i = 1; i < GRID; i++) {
                const p = i * CELL + 0.5;
                bg.beginPath(); bg.moveTo(p, 0); bg.lineTo(p, H); bg.stroke();
                bg.beginPath(); bg.moveTo(0, p); bg.lineTo(W, p); bg.stroke();
            }
        })();


        // ---------- 速度设置（三档完全一样）----------
        const START_DELAY = 300;        // 开局：每 300 毫秒走一步
        const MIN_DELAY = 90;           // 最快：90 毫秒一步（很刺激）
        const SPEED_UP_EVERY = 3;       // 每吃 3 个食物，加速一次
        const SPEED_UP_STEP = 12;       // 每次加快 12 毫秒

        // ---------- 三档难度：区别只在"规则"，不在速度 ----------
        const LEVELS = {
            easy:   { name: "简单", rule: "🟢 简单：可以穿墙，撞到自己才会结束" },
            normal: { name: "中等", rule: "🟡 中等：撞墙或撞自己都会结束" },
            hard:   { name: "困难", rule: "🔴 困难：有障碍物，撞到就结束" },
        };

        // 读取上次选的难度（旧版本的值不认识就用"中等"）
        let level = localStorage.getItem("snakeLevel") || "normal";
        if (!LEVELS[level]) level = "normal";

        let snake, food, dir, score, gameOver, delay, walls, foodsEaten;

        // 平滑动画用的两个变量
        let prevSnake = [];         // 上一次移动前，蛇在哪
        let moveTime = 0;           // 上一次移动发生在什么时刻

        // ---------- 排行榜：每个难度各存一份 ----------
        // 数据结构：{ easy: [...], normal: [...], hard: [...] }
        let allScores = JSON.parse(localStorage.getItem("snakeScoresV2") || "null");

        if (!allScores) {
            // 第一次用新版：把旧数据（一个数组）搬到"中等"难度下
            const oldScores = JSON.parse(localStorage.getItem("snakeScores") || "[]");
            allScores = { easy: [], normal: oldScores, hard: [] };
        }

        // 保险：三个键都必须存在
        if (!allScores.easy)   allScores.easy = [];
        if (!allScores.normal) allScores.normal = [];
        if (!allScores.hard)   allScores.hard = [];

        let best = 0;

        function currentScores() {
            return allScores[level] || [];
        }

        function refreshBest() {
            const list = currentScores();
            best = (list.length > 0) ? list[0] : 0;
            bestEl.textContent = best;
        }


        // ---------- 音效 ----------
        let audioCtx = null;

        function beep(freq, duration) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.001, audioCtx.currentTime + duration / 1000
            );

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }


        // ---------- 记成绩 ----------
        function saveScore(value) {
            const list = currentScores();

            list.push(value);
            list.sort(function (a, b) { return b - a; });
            allScores[level] = list.slice(0, 5);

            localStorage.setItem("snakeScoresV2", JSON.stringify(allScores));
            refreshBest();
        }


        // ---------- 生成障碍物（只有困难模式有）----------
        function buildWalls() {
            if (level !== "hard") {
                walls = [];
                return;
            }

            // 四个角落里各一条横杠
            walls = [
                { x: 4,  y: 4 },  { x: 5,  y: 4 },  { x: 6,  y: 4 },
                { x: 13, y: 4 },  { x: 14, y: 4 },  { x: 15, y: 4 },
                { x: 4,  y: 15 }, { x: 5,  y: 15 }, { x: 6,  y: 15 },
                { x: 13, y: 15 }, { x: 14, y: 15 }, { x: 15, y: 15 },
            ];
        }


        // ---------- 开始新一局 ----------
        function reset() {
            snake = [
                { x: 10, y: 10 },
                { x: 9,  y: 10 },
                { x: 8,  y: 10 },
            ];
            dir = { x: 1, y: 0 };
            score = 0;
            foodsEaten = 0;
            gameOver = false;
            delay = START_DELAY;            // 三档开局速度一样
            prevSnake = [];                 // 清掉上一局的动画残留
            scoreEl.textContent = score;
            buildWalls();
            randomFood();
            draw();
        }


        // ---------- 切换难度 ----------
        function markLevelButtons() {
            document.querySelectorAll(".spd").forEach(function (btn) {
                if (btn.dataset.level === level) btn.classList.add("on");
                else btn.classList.remove("on");
            });
            ruleEl.textContent = LEVELS[level].rule;
        }

        function setLevel(name) {
            level = name;
            localStorage.setItem("snakeLevel", name);
            markLevelButtons();
            refreshBest();
            reset();
        }

        document.querySelectorAll(".spd").forEach(function (btn) {
            btn.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                setLevel(btn.dataset.level);
            });
        });


        function setDir(nx, ny) {
            if (gameOver) return;
            if (nx !== 0 && dir.x === -nx) return;
            if (ny !== 0 && dir.y === -ny) return;
            dir = { x: nx, y: ny };
        }


        function drawCell(gx, gy, color, radius, scale) {
            if (radius === undefined) radius = 6;
            if (scale === undefined) scale = 1;

            const size = (CELL - 2) * scale;
            const px = gx * CELL + CELL / 2 - size / 2;    // 以格子中心对齐
            const py = gy * CELL + CELL / 2 - size / 2;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(px, py, size, size, radius);
            ctx.fill();
        }


        // ---------- 画一只二次元大眼睛（含两个高光）----------
        function drawAnimeEye(ctx, ex, ey) {
            // 眼白
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(ex, ey, 3.2, 3.7, 0, 0, Math.PI * 2);
            ctx.fill();

            // 虹膜
            ctx.fillStyle = "#1f6b52";
            ctx.beginPath();
            ctx.ellipse(ex, ey + 0.4, 2.5, 2.9, 0, 0, Math.PI * 2);
            ctx.fill();

            // 瞳孔
            ctx.fillStyle = "#0b2e24";
            ctx.beginPath();
            ctx.ellipse(ex, ey + 0.5, 1.25, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // ✨ 高光 1：大的，偏左上
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ex - 1.0, ey - 1.4, 1.1, 0, Math.PI * 2);
            ctx.fill();

            // ✨ 高光 2：小的，偏右下
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.beginPath();
            ctx.arc(ex + 0.9, ey + 1.3, 0.6, 0, Math.PI * 2);
            ctx.fill();
        }


        function drawDot(cx, cy, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        }


        // ---------- 随机放食物（不能放在蛇身或障碍物上）----------
        function randomFood() {
            let p, blocked;

            do {
                blocked = false;
                p = {
                    x: Math.floor(Math.random() * GRID),
                    y: Math.floor(Math.random() * GRID),
                };

                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === p.x && snake[i].y === p.y) blocked = true;
                }
                for (let i = 0; i < walls.length; i++) {
                    if (walls[i].x === p.x && walls[i].y === p.y) blocked = true;
                }
            } while (blocked);

            food = p;
        }


        function draw(progress) {
            // progress：0 = 刚开始走，1 = 走完这一格
            if (progress === undefined) progress = 1;

            ctx.drawImage(bgCanvas, 0, 0);        // 直接贴上预渲染好的背景

            // 障碍物
            for (let i = 0; i < walls.length; i++) {
                drawCell(walls[i].x, walls[i].y, "#3d3160", 4);
            }

            // ---------- 食物：小苹果 🍎 ----------
            const fx0 = food.x * CELL + CELL / 2;
            const fy0 = food.y * CELL + CELL / 2;

            ctx.save();                       // 存个档（等下 restore 恢复）
            ctx.shadowColor = "#ff5566";
            ctx.shadowBlur = 14;
            ctx.font = "19px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🍎", fx0, fy0 + 1);
            ctx.restore();                    // 恢复画笔设置

            // ---------- 算出蛇每一节"现在显示在哪" ----------
            const pos = [];

            for (let i = 0; i < snake.length; i++) {
                const to = snake[i];
                const from = prevSnake[i] || to;      // 新长出来的一节：原地不动

                let x, y;

                // 穿墙了？距离超过 1 格 → 直接瞬移，不做插值
                if (Math.abs(to.x - from.x) > 1 || Math.abs(to.y - from.y) > 1) {
                    x = to.x;
                    y = to.y;
                } else {
                    // 插值：从 from 往 to 走了 progress 那么远
                    x = from.x + (to.x - from.x) * progress;
                    y = from.y + (to.y - from.y) * progress;
                }

                pos.push({ x: x, y: y });
            }

            // ---------- 蛇身：一整条连续的"管子" ----------
            const bw = CELL - 3;                   // 管子粗细

            const headPx = pos[0].x * CELL + CELL / 2;
            const headPy = pos[0].y * CELL + CELL / 2;
            const tailPx = pos[pos.length - 1].x * CELL + CELL / 2;
            const tailPy = pos[pos.length - 1].y * CELL + CELL / 2;

            // 薄荷绿糖果渐变（二次元配色）
            const bodyGrad = ctx.createLinearGradient(headPx, headPy, tailPx, tailPy);
            bodyGrad.addColorStop(0, "#8ef5c4");
            bodyGrad.addColorStop(1, "#3fc48d");

            ctx.strokeStyle = bodyGrad;
            ctx.lineWidth = bw;
            ctx.lineCap = "round";          // 两端圆头
            ctx.lineJoin = "round";         // 拐弯圆角 ← 关键！转弯处不会有尖角

            // 一条完整路径：只在"穿墙"的地方断开
            ctx.beginPath();
            ctx.moveTo(headPx, headPy);

            for (let i = 1; i < pos.length; i++) {
                const a = pos[i - 1];
                const b = pos[i];

                if (Math.abs(a.x - b.x) > 1 || Math.abs(a.y - b.y) > 1) {
                    ctx.stroke();                     // 断开
                    ctx.beginPath();
                    ctx.moveTo(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2);
                } else {
                    ctx.lineTo(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2);
                }
            }

            ctx.stroke();

            // ---------- 蛇头 ----------
            const hx = pos[0].x * CELL + CELL / 2;
            const hy = pos[0].y * CELL + CELL / 2;

            const headR = bw / 2 + 1.2;

            ctx.fillStyle = "#a8ffd6";
            ctx.beginPath();
            ctx.arc(hx, hy, headR, 0, Math.PI * 2);
            ctx.fill();

            // 头上的柔和高光
            ctx.fillStyle = "rgba(255,255,255,0.30)";
            ctx.beginPath();
            ctx.ellipse(hx - dir.x * 2, hy - dir.y * 2,
                        headR * 0.52, headR * 0.34,
                        Math.atan2(dir.y, dir.x), 0, Math.PI * 2);
            ctx.fill();

            // ---------- 蛇脸 ----------

            // 脸的朝向 = "头 → 脖子"的实际方向
            // 这样转向时，脸会跟着身体慢慢转过去，而不是"啪"一下扭头
            let fdx = pos[0].x - pos[1].x;
            let fdy = pos[0].y - pos[1].y;

            const flen = Math.sqrt(fdx * fdx + fdy * fdy);

            if (flen < 0.001) {
                fdx = dir.x;                      // 头和脖子重合了（极端情况）
                fdy = dir.y;
            } else {
                fdx = fdx / flen;                 // 归一化成"单位方向"
                fdy = fdy / flen;
            }

            const px = -fdy;                      // 侧向单位向量
            const py = fdx;

            // 两眼的位置
            const eyeFwd  = headR * 0.18;
            const eyeSide = headR * 0.44;

            const ex1 = hx + fdx * eyeFwd + px * eyeSide;
            const ey1 = hy + fdy * eyeFwd + py * eyeSide;
            const ex2 = hx + fdx * eyeFwd - px * eyeSide;
            const ey2 = hy + fdy * eyeFwd - py * eyeSide;

            // 腮红（先画，会被眼睛盖住一点点）
            const cheekOff = headR * 0.70;

            ctx.fillStyle = "rgba(255,150,180,0.6)";
            ctx.beginPath();
            ctx.ellipse(hx + px * cheekOff - fdx * 2, hy + py * cheekOff - fdy * 2,
                        2.5, 1.7, Math.atan2(fdy, fdx), 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(hx - px * cheekOff - fdx * 2, hy - py * cheekOff - fdy * 2,
                        2.5, 1.7, Math.atan2(fdy, fdx), 0, Math.PI * 2);
            ctx.fill();

            // ✨ 两只大眼睛
            drawAnimeEye(ctx, ex1, ey1);
            drawAnimeEye(ctx, ex2, ey2);

            // 结束遮罩
            if (gameOver) {
                const W = canvas.width;
                const H = canvas.height;

                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = "center";

                ctx.fillStyle = "#e94560";
                ctx.font = "bold 34px sans-serif";
                ctx.fillText("游戏结束", W / 2, 62);

                ctx.fillStyle = "#eee";
                ctx.font = "20px sans-serif";
                ctx.fillText("本次得分：" + score, W / 2, 102);

                if (score >= best && score > 0) {
                    ctx.fillStyle = "#f0c040";
                    ctx.font = "bold 17px sans-serif";
                    ctx.fillText("🏆 新纪录！", W / 2, 130);
                }

                const list = currentScores();

                ctx.fillStyle = "#c9a6ff";
                ctx.font = "bold 20px sans-serif";
                ctx.fillText("🏆 " + LEVELS[level].name + "难度 · 排行榜", W / 2, 172);

                if (list.length === 0) {
                    ctx.fillStyle = "#666";
                    ctx.font = "16px sans-serif";
                    ctx.fillText("还没有记录", W / 2, 210);
                }

                for (let i = 0; i < list.length; i++) {
                    const y = 204 + i * 27;
                    ctx.fillStyle = (i < 3) ? "#f0c040" : "#888";
                    ctx.font = (i < 3) ? "bold 19px sans-serif" : "17px sans-serif";
                    const medal = (i === 0) ? "🥇" : (i === 1) ? "🥈" : (i === 2) ? "🥉" : (i + 1) + ".";
                    ctx.fillText(medal + "  " + list[i] + " 分", W / 2, y);
                }

                ctx.fillStyle = "#666";
                ctx.font = "14px sans-serif";
                ctx.fillText("按空格或点画面重新开始", W / 2, H - 22);
            }
        }


        // ---------- 检查某个位置是不是障碍物 ----------
        function isWall(x, y) {
            for (let i = 0; i < walls.length; i++) {
                if (walls[i].x === x && walls[i].y === y) return true;
            }
            return false;
        }


        function move() {
            if (gameOver) return;

            const head = snake[0];
            const newHead = { x: head.x + dir.x, y: head.y + dir.y };

            // ---------- 撞墙 ----------
            const outOfBounds =
                newHead.x < 0 || newHead.x >= GRID ||
                newHead.y < 0 || newHead.y >= GRID;

            if (outOfBounds) {
                if (level === "easy") {
                    // 简单模式：从对面穿出来
                    if (newHead.x < 0) newHead.x = GRID - 1;
                    if (newHead.x >= GRID) newHead.x = 0;
                    if (newHead.y < 0) newHead.y = GRID - 1;
                    if (newHead.y >= GRID) newHead.y = 0;
                } else {
                    die();
                    return;
                }
            }

            // ---------- 撞障碍物 ----------
            if (isWall(newHead.x, newHead.y)) {
                die();
                return;
            }

            // ---------- 撞自己 ----------
            for (let i = 0; i < snake.length - 1; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    die();
                    return;
                }
            }

            // 记录移动前的位置（画面插值要用）
            // ⚠️ 必须"拷贝"，不能直接 = snake（那是同一个数组！）
            prevSnake = [];
            for (let i = 0; i < snake.length; i++) {
                prevSnake.push({ x: snake[i].x, y: snake[i].y });
            }

            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                score = score + 1;
                scoreEl.textContent = score;
                beep(880, 90);

                foodsEaten = foodsEaten + 1;

                // 每吃 SPEED_UP_EVERY 个，就加快一点（但不会快过 MIN_DELAY）
                if (foodsEaten % SPEED_UP_EVERY === 0) {
                    delay = Math.max(MIN_DELAY, delay - SPEED_UP_STEP);
                }

                randomFood();
            } else {
                snake.pop();
            }
        }


        function die() {
            gameOver = true;
            beep(150, 400);
            saveScore(score);
            draw();
        }


        // ---------- 键盘 ----------
        document.addEventListener("keydown", function (event) {
            const key = event.key;
            if (key.startsWith("Arrow") || key === " ") event.preventDefault();

            if (key === " ") {
                if (gameOver) reset();
                return;
            }

            if (key === "ArrowUp")    setDir(0, -1);
            if (key === "ArrowDown")  setDir(0, 1);
            if (key === "ArrowLeft")  setDir(-1, 0);
            if (key === "ArrowRight") setDir(1, 0);
        });


        // ---------- 屏幕按钮 ----------
        document.querySelectorAll(".pad-btn").forEach(function (btn) {
            btn.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                setDir(Number(btn.dataset.x), Number(btn.dataset.y));
            });
        });

        canvas.addEventListener("pointerdown", function () {
            if (gameOver) reset();
        });


        // ---------- 滑动手势 ----------
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", function (event) {
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener("touchend", function (event) {
            const dx = event.changedTouches[0].clientX - touchStartX;
            const dy = event.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) setDir(1, 0);
                else        setDir(-1, 0);
            } else {
                if (dy > 0) setDir(0, 1);
                else        setDir(0, -1);
            }
        }, { passive: true });


        // ---------- 两条线：逻辑按节奏走，画面每秒 60 次 ----------

        // 【逻辑】每隔 delay 毫秒走一格
        function tick() {
            move();
            moveTime = performance.now();       // 记下这一格是"什么时候开始的"
            setTimeout(tick, delay);
        }

        // 【画面】浏览器每一帧调一次，画出"走到一半"的样子
        function render() {
            const elapsed = performance.now() - moveTime;
            let progress = elapsed / delay;

            if (progress > 1) progress = 1;      // 最多走到 100%

            draw(progress);
            requestAnimationFrame(render);       // 下一帧再叫我
        }

        markLevelButtons();
        refreshBest();
        reset();
        tick();
        render();
    </script>

</body>
</html>
